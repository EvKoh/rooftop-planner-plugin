<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vanlife</title>
  <!-- trek:ui -->
  <style>
    /* A widget at the foot of TREK's place panel: the night's status, the host's contact
       (e-mail, phone, website as links) and the amenities read at a glance; the editor
       folded until asked for. TREK's header already shows the place's price, so only what
       it cannot show (per person, dog fee) is repeated here. Text is never under 12 px. */
    body.trek-ui { margin: 0; }
    .w { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
    .line { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 14px; color: var(--text-secondary); }
    .line span { white-space: nowrap; }
    .muted { font-size: 13px; color: var(--text-muted); overflow-wrap: anywhere; }
    .edit-btn { min-height: 44px; }
    .contact { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
    .contact a { color: var(--accent, inherit); text-decoration: underline; overflow-wrap: anywhere; min-height: 24px; }
    .sub { font-size: 12px; font-weight: 700; color: var(--text-faint); margin-top: 4px; }
    form { display: flex; flex-direction: column; gap: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-muted); }
    input, select { font-size: 16px; min-height: 44px; box-sizing: border-box; width: 100%; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button { min-height: 44px; }
    /* The card: key figures as tiles, then labelled rows; the colour of a row's pictogram is
       its tone from design.js (amber = to watch). Long lists wrap, nothing scrolls sideways. */
    .about { margin: 0; font-size: 14px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
    .about.open { display: block; }
    .sec { display: flex; flex-direction: column; gap: 6px; }
    .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
    .fig { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; border-radius: 10px; background: var(--bg-secondary, rgba(127,127,127,.08)); min-width: 0; }
    .fig svg, .rh svg { width: 16px; height: 16px; flex: none; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fv { font-size: 16px; font-weight: 700; color: var(--text-primary); overflow-wrap: anywhere; }
    .fl { font-size: 12px; color: var(--text-muted); }
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rh { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lab { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .row--watch .lab, .row--danger .lab { color: var(--c); }
    .row--danger .val { color: var(--c); }
    .val { font-size: 14px; color: var(--text-primary); white-space: pre-line; overflow-wrap: anywhere; }
    .row a { font-size: 14px; overflow-wrap: anywhere; color: var(--accent, inherit); }
    .items { margin: 0; padding-left: 22px; font-size: 14px; color: var(--text-primary); display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
    .fold { border-top: 1px solid var(--border-faint, rgba(127,127,127,.2)); padding-top: 6px; }
    .fold summary { cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-faint); min-height: 32px; display: flex; align-items: center; }
    .fold .rows { padding-top: 6px; }
    .line span { white-space: normal; }
    /* The night's four states: the colour is the state's (design.js), the same as the map's. */
    .states { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
    .state { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 6px 10px;
      border: 2px solid var(--c); border-radius: 10px; background: transparent; color: var(--text-primary); font: inherit; font-size: 14px; cursor: pointer; }
    .state svg { width: 18px; height: 18px; flex: none; stroke: var(--c); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .state[aria-pressed="true"] { background: var(--c); color: #fff; font-weight: 700; }
    .state[aria-pressed="true"] svg { stroke: #fff; }
    .state:disabled { opacity: .6; cursor: default; }
    .night { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="trek-ui">
  <main class="w" id="app"><div class="trek-skeleton" style="height:44px;border-radius:10px"></div></main>
  <script>
    // All text comes from POST /amenities (server/i18n), in the frame's language unless the
    // user chose one in the plugin settings: no string is written here.
    var st = { tripId: null, placeId: null, locale: 'en', mode: 'view', data: null, open: false, tried: {}, filling: false, night: null, dayId: null, pending: null, busy: false };
    var S = function (k) { return (st.data && st.data.strings[k]) || ''; };

    function h(tag, attrs, kids) {
      var el = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === 'text') el.textContent = attrs[k];
        else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { el.addEventListener(ev, attrs.on[ev]); });
        else if (attrs[k] !== null && attrs[k] !== undefined) el.setAttribute(k, attrs[k]);
      });
      (kids || []).forEach(function (c) { if (c) el.appendChild(c); });
      return el;
    }
    // The locale of the language the strings are in (server/lib/i18n.js), for dates.
    function loc() { return (st.data && st.data.locale) || st.locale; }
    // Every call says the panel's language, so an error comes back in it.
    function body(b) { return Object.assign({ locale: (st.data && st.data.language) || st.locale }, b); }
    // A night state's tone (server/lib/design.js) → TREK's chip class.
    var CHIP_CLASS = { success: 'trek-chip--success', warn: 'trek-chip--warning', danger: 'trek-chip--danger' };
    function stateOf(d, status) { return (d.states || []).find(function (s) { return s.status === status; }) || null; }
    function contactLinks(d) {
      var c = d.reach || {};
      var phone = c.phone;
      var site = c.website;
      var links = [];
      if (c.email) links.push(h('a', { href: 'mailto:' + c.email, text: c.email }));
      if (phone) links.push(h('a', { href: 'tel:' + String(phone).replace(/[^+0-9]/g, ''), text: phone }));
      if (c.whatsapp) links.push(h('a', { href: 'https://wa.me/' + String(c.whatsapp).replace(/\D/g, ''), target: '_blank', rel: 'noopener noreferrer', text: S('ch.whatsapp') + ' ' + c.whatsapp }));
      if (site && /^https?:\/\//i.test(site)) links.push(h('a', { href: site, target: '_blank', rel: 'noopener noreferrer', text: site.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '') }));
      var kids = [h('div', { class: 'sub', text: S('ui.contacts') })];
      kids.push(links.length ? h('div', { class: 'contact' }, links) : h('div', { class: 'muted', text: S('ui.noContact') }));
      var more = [];
      if (c.contact_name) more.push(c.contact_name);
      if (c.preferred_channel) more.push(S('ui.preferredChannel') + ': ' + S('ch.' + c.preferred_channel));
      if (c.languages && c.languages.length) more.push(c.languages.join(', '));
      if (c.notes) more.push(c.notes);
      if (more.length) kids.push(h('div', { class: 'muted', text: more.join(' · ') }));
      var last = d.info.log && d.info.log[0];
      if (last) kids.push(h('div', { class: 'muted', text: S('ui.lastExchange').replace('{date}', last.date).replace('{summary}', last.summary) }));
      return kids;
    }

    // The place's card, the same for every place of its kind (server/lib/place-sheet.js):
    // fixed sections in a fixed order, then what the plugin keeps (amenities, access, the
    // night), the host's contact on a night only, and the folded rest (checks, other notes).
    function svgIcon(markup, color) {
      var el = icon(markup);
      if (color) el.style.stroke = color;
      return el;
    }
    function valueNode(r) {
      if (r.items && r.items.length) {
        var list = h(r.field === 'itinerary' ? 'ol' : 'ul', { class: 'items' }, r.items.map(function (i) { return h('li', { text: i }); }));
        return list;
      }
      if (r.url) return h('a', { href: r.url, target: '_blank', rel: 'noopener noreferrer', text: r.linkText || r.url, title: r.url });
      return h('span', { class: 'val', text: r.text });
    }
    function rowNode(r) {
      var head = [svgIcon(r.icon, r.color), r.label ? h('span', { class: 'lab', text: r.label }) : null];
      if (r.chip) head.push(h('span', { class: 'trek-chip', text: r.chip }));
      var kids = [h('div', { class: 'rh' }, head)];
      if (!(r.chip && r.text.length < 24)) kids.push(valueNode(r));
      if (r.links && r.links.length && !(r.items && r.items.length)) kids.push(h('div', { class: 'contact' }, r.links.map(function (u) { return h('a', { href: u, target: '_blank', rel: 'noopener noreferrer', text: u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 60) }); })));
      return h('div', { class: 'row' + (r.tone === 'warn' ? ' row--watch' : r.tone === 'danger' ? ' row--danger' : ''), style: '--c:' + r.color }, kids);
    }
    // Key figures: a tile per short value; a figure with no short form, or a price's detail,
    // reads as a row under the tiles.
    function figuresNode(sec) {
      var tiles = sec.rows.filter(function (r) { return r.figure; });
      var rest = sec.rows.filter(function (r) { return !r.figure; });
      var kids = [];
      if (tiles.length) kids.push(h('div', { class: 'figs' }, tiles.map(function (r) {
        return h('div', { class: 'fig', title: r.label + ' — ' + r.text }, [
          svgIcon(r.icon, r.color),
          h('span', { class: 'fv', text: r.figure }),
          h('span', { class: 'fl', text: r.label }),
        ]);
      })));
      tiles.filter(function (r) { return r.detail; }).forEach(function (r) { kids.push(h('div', { class: 'muted', text: S('ui.labelValue').replace('{label}', r.label).replace('{value}', r.detail) })); });
      if (rest.length) kids.push(h('div', { class: 'rows' }, rest.map(rowNode)));
      return h('div', { class: 'rows' }, kids);
    }
    function sectionNode(sec) {
      var body = sec.figures ? figuresNode(sec) : h('div', { class: 'rows' }, sec.rows.map(rowNode));
      if (sec.folded) {
        var det = h('details', { class: 'fold' }, [h('summary', { text: sec.title + ' (' + sec.rows.length + ')' }), body]);
        return det;
      }
      return h('section', { class: 'sec' }, [h('div', { class: 'sub', text: sec.title }), body]);
    }
    function sheetNodes(d, folded) {
      var sh = d.sheet;
      if (!sh) return [];
      var out = [];
      if (!folded && sh.about && sh.about.length) {
        var about = h('p', { class: 'about', text: sh.about.join(' ') });
        about.addEventListener('click', function () { about.classList.toggle('open'); });
        out.push(about);
      }
      sh.sections.forEach(function (sec) { if (!!sec.folded === folded) out.push(sectionNode(sec)); });
      return out;
    }
    function chips(d) {
      var kids = [];
      // The selected evening's status (the night section's), else the place's strongest.
      var row = st.night && st.night.nights.find(function (r) { return r.dayId === st.dayId; });
      var status = row ? row.status : d.nightStatus;
      var state = status && stateOf(d, status);
      if (state && CHIP_CLASS[state.tone]) kids.push(h('span', { class: 'trek-chip ' + CHIP_CLASS[state.tone], text: S('ui.night').replace('{status}', S('st.' + status)) }));
      if (d.refused) kids.push(h('span', { class: 'trek-chip trek-chip--danger', text: d.refusedText ? S('ui.vehicleRefused') + ' — ' + d.refusedText : S('ui.vehicleRefused') }));
      return kids.length ? [h('div', { class: 'line' }, kids)] : [];
    }
    // What the plugin keeps itself: amenities (a night always, others when recorded), the
    // price details TREK's header cannot show, the visit (not a hike: its duration is a key
    // figure), timed access and booking.
    function extras(d) {
      var kids = [];
      var hike = d.sheet && d.sheet.kind === 'hike';
      var extra = [];
      if (d.priceText && (d.info.per || d.info.price_note || (d.info.amenities.dog === 'fee' && d.info.dog_fee != null))) extra.push(d.priceText);
      if (d.summary || d.night) {
        kids.push(h('div', { class: 'sub', text: S('ui.title') }));
        if (d.summary) kids.push(h('div', { class: 'line' }, d.summary.split('  ').map(function (p) { return h('span', { text: p }); })));
        else kids.push(h('div', { class: 'muted', text: S('ui.none') }));
      }
      if (extra.length) kids.push(h('div', { class: 'muted', text: extra.join(' · ') }));
      if (d.visitText && !hike) kids.push(h('div', { class: 'line' }, [h('span', { text: S('ui.labelValue').replace('{label}', S('ui.visit')).replace('{value}', d.visitText) })]));
      if (d.parkingText) kids.push(h('div', { class: 'line' }, [h('span', { text: d.parkingText })]));
      if (d.info.source_url && /^https?:\/\//i.test(d.info.source_url)) kids.push(h('div', { class: 'contact' }, [h('a', { href: d.info.source_url, target: '_blank', rel: 'noopener noreferrer', text: d.info.source_url.replace(/^https?:\/\/(www\.)?/i, '').split('/')[0] })]));
      if (d.access && d.access.length) kids.push(h('div', { class: 'line' }, d.access.map(function (a) { return h('span', { class: a.tone === 'warn' ? 'trek-chip trek-chip--warning' : 'trek-chip', text: a.value }); })));
      var bk = [];
      if (d.info.booking_url && /^https?:\/\//i.test(d.info.booking_url)) bk.push(h('a', { href: d.info.booking_url, target: '_blank', rel: 'noopener noreferrer', text: S('ui.book') }));
      if (d.info.booking_note) bk.push(h('span', { class: 'muted', text: d.info.booking_note }));
      if (bk.length) kids.push(h('div', { class: 'contact' }, bk));
      if (d.info.visit_source && !hike) kids.push(h('div', { class: 'muted', text: S('ui.sourceShort').replace('{source}', d.info.visit_source) }));
      if (d.info.source) kids.push(h('div', { class: 'muted', text: S('ui.sourceShort').replace('{source}', d.info.source) + (d.info.checked ? ' · ' + new Intl.DateTimeFormat(loc(), { dateStyle: 'medium', timeZone: 'UTC' }).format(new Date(d.info.checked + 'T12:00:00Z')) : '') }));
      return kids;
    }

    function field(label, input) { return h('label', {}, [h('span', { text: label }), input]); }
    function select(name, options, value, labelOf) {
      var s = h('select', { class: 'trek-select', name: name }, options.map(function (o) { var e = h('option', { value: o, text: labelOf(o) }); if (o === value) e.selected = true; return e; }));
      return s;
    }
    function textInput(name, value, type, extra) {
      var i = h('input', Object.assign({ class: 'trek-input', type: type || 'text', name: name, maxlength: '300' }, extra || {}));
      if (value != null) i.value = String(value);
      return i;
    }
    function number(name, value, step) {
      var i = h('input', { class: 'trek-input', type: 'number', name: name, step: step || '0.01', min: '0', inputmode: 'decimal' });
      if (value != null) i.value = String(value);
      return i;
    }

    function minutes(name, value) {
      var i = h('input', { class: 'trek-input', type: 'number', name: name, step: '5', min: '5', max: '1440', inputmode: 'numeric' });
      if (value != null) i.value = String(value);
      return i;
    }

    function editor(d) {
      var opt = function (o) { return S('opt.' + o); };
      var c = d.info.contacts || {};
      var cur = h('input', { class: 'trek-input', name: 'currency', maxlength: '3', autocapitalize: 'characters' });
      cur.value = d.currency;
      var src = h('input', { class: 'trek-input', name: 'source', maxlength: '300' });
      if (d.info.source) src.value = d.info.source;
      var chk = h('input', { class: 'trek-input', name: 'checked', type: 'date' });
      if (d.info.checked) chk.value = d.info.checked;
      var form = h('form', {}, [
        h('div', { class: 'grid' }, [
          field(S('ui.price'), number('price_amount', d.price)),
          field(S('ui.currency'), cur),
          field(S('ui.per'), select('per', [''].concat(d.units || []), d.info.per || '', function (o) { return o ? S('ui.per.' + o) : S('ui.perNone'); })),
          field(S('ui.dogFee'), number('dog_fee', d.info.dog_fee)),
        ]),
        field(S('ui.priceNote'), textInput('price_note', d.info.price_note, 'text', { maxlength: '120', placeholder: S('ui.priceNoteHint') })),
        h('div', { class: 'grid' }, Object.keys(d.amenities).map(function (k) {
          return field(S('amLong.' + k), select(k, d.amenities[k], d.info.amenities[k] || 'unknown', opt));
        })),
        h('div', { class: 'grid' }, [
          field(S('ui.visitMin'), minutes('visit_min_minutes', d.info.visit_min_minutes)),
          field(S('ui.visitMax'), minutes('visit_max_minutes', d.info.visit_max_minutes)),
        ]),
        h('div', { class: 'sub', text: S('ui.access') }),
        h('div', { class: 'grid' }, [
          field(S('ui.accessBefore'), textInput('access_before', d.info.access_before, 'time')),
          field(S('ui.accessAfter'), textInput('access_after', d.info.access_after, 'time')),
          field(S('ui.bookingRequired'), select('booking_required', ['unknown', 'yes', 'no'], d.info.booking_required === true ? 'yes' : d.info.booking_required === false ? 'no' : 'unknown', function (o) { return S('opt.' + o); })),
          field(S('ui.bookingUrl'), textInput('booking_url', d.info.booking_url, 'url', { autocomplete: 'off', inputmode: 'url', maxlength: '500' })),
          field(S('ui.tollAmount'), number('toll_amount', d.info.toll_amount)),
          field(S('ui.tollCurrency'), textInput('toll_currency', d.info.toll_currency, 'text', { maxlength: '3', autocapitalize: 'characters', placeholder: d.currency })),
        ]),
        field(S('ui.bookingNote'), textInput('booking_note', d.info.booking_note, 'text', { maxlength: '120', placeholder: S('ui.bookingNoteHint') })),
        h('div', { class: 'grid' }, [
          field(S('ui.maxHeight'), number('max_height_m', d.info.max_height_m)),
          field(S('ui.maxLength'), number('max_length_m', d.info.max_length_m)),
          field(S('ui.maxWeight'), number('max_weight_t', d.info.max_weight_t)),
        ]),
        h('div', { class: 'grid' }, [field(S('ui.source'), src), field(S('ui.checked'), chk)]),
        h('div', { class: 'sub', text: S('ui.contacts') }),
        h('div', { class: 'grid' }, [
          field(S('ui.email'), textInput('c_email', c.email, 'email', { autocomplete: 'off', inputmode: 'email' })),
          field(S('ui.phone'), textInput('c_phone', c.phone, 'tel', { autocomplete: 'off' })),
          field(S('ui.whatsapp'), textInput('c_whatsapp', c.whatsapp, 'tel', { autocomplete: 'off' })),
          field(S('ui.website'), textInput('c_website', c.website, 'url', { autocomplete: 'off', inputmode: 'url' })),
          field(S('ui.contactName'), textInput('c_contact_name', c.contact_name)),
          field(S('ui.languages'), textInput('c_languages', (c.languages || []).join(', '))),
          field(S('ui.preferredChannel'), select('c_preferred_channel', [''].concat(d.channels || []), c.preferred_channel || '', function (o) { return o ? S('ch.' + o) : S('ui.noPreference'); })),
          field(S('ui.contactNotes'), textInput('c_notes', c.notes)),
        ]),
        h('p', { class: 'muted', text: S('ui.onlySourced') }),
        h('div', { class: 'actions' }, [
          h('button', { class: 'trek-btn trek-btn--primary', type: 'submit', text: S('ui.save') }),
          d.recorded ? h('button', { class: 'trek-btn trek-btn--ghost', type: 'button', text: S('ui.clear'), on: { click: clearIt } }) : null,
        ]),
      ]);
      form.addEventListener('submit', function (e) { e.preventDefault(); save(form); });
      return form;
    }

    // The night's state, set from here: which evening, then one of the four states.
    // "Booked" and "Cancelled" ask for their optional number or reason before saving.
    function dayLabel(r) {
      var date = r.date ? new Intl.DateTimeFormat(loc(), { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }).format(new Date(r.date + 'T12:00:00Z')) : null;
      var t = date ? S('ui.dayOption').replace('{n}', String(r.day)).replace('{date}', date) : S('ui.dayOnly').replace('{n}', String(r.day));
      if (r.nights > 1) t += ' · ' + S('ui.nightsN').replace('{n}', String(r.nights));
      if (r.planned && !r.planned.mine) t += ' — ' + r.planned.name;
      return t;
    }
    function icon(svg) {
      var el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      el.setAttribute('viewBox', '0 0 24 24'); el.setAttribute('aria-hidden', 'true');
      el.innerHTML = svg || '';
      return el;
    }
    function nightSection() {
      var n = st.night;
      if (!n || !n.nights.length) return null;
      var row = n.nights.find(function (r) { return r.dayId === st.dayId; }) || n.nights[0];
      var current = row.status || 'spotted';
      var pick = h('select', { class: 'trek-select', name: 'night_day', 'aria-label': S('ui.nightOf') }, n.nights.map(function (r) {
        var o = h('option', { value: String(r.dayId), text: dayLabel(r) }); if (r.dayId === row.dayId) o.selected = true; return o;
      }));
      pick.addEventListener('change', function () { st.dayId = Number(pick.value); st.pending = null; render(); });
      var buttons = h('div', { class: 'states', role: 'group', 'aria-label': S('ui.nightTitle') }, n.states.map(function (s) {
        var b = h('button', { class: 'state', type: 'button', style: '--c:' + s.color, 'aria-pressed': String(s.status === current || s.status === st.pending), disabled: st.busy ? 'disabled' : null,
          on: { click: function () { chooseState(row, s.status); } } }, [icon(s.svg)]);
        b.appendChild(document.createTextNode(S('ui.state.' + s.status)));
        return b;
      }));
      var kids = [h('div', { class: 'sub', text: S('ui.nightTitle') }), field(S('ui.nightOf'), pick), buttons];
      if (st.pending) {
        var key = st.pending === 'booked' ? 'confirmation' : 'reason';
        var input = textInput(key, st.pending === 'booked' ? row.confirmation : null, 'text', { maxlength: st.pending === 'booked' ? '100' : '200', autocomplete: 'off' });
        kids.push(field(S(st.pending === 'booked' ? 'ui.confirmationOpt' : 'ui.reasonOpt'), input));
        kids.push(h('div', { class: 'actions' }, [
          h('button', { class: 'trek-btn trek-btn--primary', type: 'button', disabled: st.busy ? 'disabled' : null, text: S('ui.save'), on: { click: function () { var b = {}; b[key] = input.value; setNight(row, st.pending, b); } } }),
          h('button', { class: 'trek-btn trek-btn--ghost', type: 'button', text: S('ui.close'), on: { click: function () { st.pending = null; render(); } } }),
        ]));
      }
      return h('div', { class: 'night' }, kids);
    }
    async function chooseState(row, status) {
      if (status === 'booked' || status === 'dropped') { st.pending = status; render(); return; }
      st.pending = null;
      if (status === (row.status || 'spotted')) { render(); return; }
      if (status === 'spotted' && row.reservationId && !(await trek.confirm({ message: S('ui.confirmAvailable'), danger: true }))) return;
      setNight(row, status, {});
    }
    async function setNight(row, status, extra) {
      st.busy = true; render();
      try {
        var r = await trek.invoke('/night/set', { method: 'POST', body: body(Object.assign({ tripId: Number(st.tripId), placeId: Number(st.placeId), dayId: row.dayId, status: status }, extra)) });
        st.night = { states: st.night.states, nights: r.nights };
        st.dayId = r.dayId;
        st.pending = null;
        trek.notify('success', S('ui.nightSet').replace('{status}', S('ui.state.' + status)));
        // TREK broadcasts the booking: its map and lists follow on their own.
        loadAmenities();
      } catch (e) { trek.notify('error', e.message); }
      st.busy = false; render();
    }
    async function loadNight() {
      try {
        var r = await trek.invoke('/night', { method: 'POST', body: body({ tripId: Number(st.tripId), placeId: Number(st.placeId) }) });
        st.night = r;
        if (!st.dayId || !r.nights.some(function (x) { return x.dayId === st.dayId; })) st.dayId = r.dayId;
        render();
      } catch (e) { st.night = null; }
    }

    function render() {
      var app = document.getElementById('app');
      var d = st.data;
      if (!d) return;
      document.documentElement.lang = d.language;
      var nightish = d.night || !!d.nightStatus;
      app.replaceChildren(
        h('div', { class: 'head' }, [
          h('span', { class: 'eyebrow', text: (d.sheet && d.sheet.title) || S('ui.title') }),
          h('button', { class: 'trek-btn trek-btn--ghost edit-btn', type: 'button', 'aria-expanded': String(st.open), text: st.open ? S('ui.close') : S('ui.edit'), on: { click: function () { st.open = !st.open; render(); } } }),
        ])
      );
      var add = function (n) { if (n) app.appendChild(n); };
      chips(d).forEach(add);
      sheetNodes(d, false).forEach(add);
      extras(d).forEach(add);
      if (nightish) { add(nightSection()); contactLinks(d).forEach(add); }
      sheetNodes(d, true).forEach(add);
      app.appendChild(h('div', { class: 'actions' }, [
        h('button', { class: 'trek-btn trek-btn--ghost', type: 'button', disabled: st.filling ? 'disabled' : null, text: st.filling ? S('ui.filling') : S('ui.fillTrip'), on: { click: fillTrip } }),
      ]));
      if (st.open) app.appendChild(editor(d));
    }

    function load() {
      if (!st.tripId || !st.placeId) return;
      loadAmenities();
      loadNight();
    }
    async function loadAmenities() {
      try {
        st.data = await trek.invoke('/amenities', { method: 'POST', body: { tripId: Number(st.tripId), placeId: Number(st.placeId), locale: st.locale } });
        render();
        // The card shows the place's description and notes structured: TREK may fold its raw copy.
        var sh = st.data.sheet;
        try { window.parent.postMessage({ type: 'trek:place-text', structured: !!(sh && (sh.sections.length || sh.about.length)) }, '*'); } catch (e) { /* no host */ }
        // First visit of a place with nothing recorded: look it up once in the open sources.
        if (!st.data.recorded && !st.tried[st.placeId]) {
          st.tried[st.placeId] = true;
          // A background lookup: a slow or busy source must not replace the card with an error.
          try {
            var r = await trek.invoke('/amenities/fill', { method: 'POST', body: body({ tripId: Number(st.tripId), placeId: Number(st.placeId) }) });
            if (r && r.filled) loadAmenities();
          } catch (e) { /* open sources busy: the card stays as it is */ }
        }
      } catch (e) {
        document.getElementById('app').replaceChildren(h('p', { class: 'muted', text: '⚠ ' + e.message }));
      }
    }
    async function save(form) {
      var set = {}, contacts = {};
      // Contact fields (c_*) go in one object; an emptied field is erased (null).
      new FormData(form).forEach(function (v, k) {
        if (k.indexOf('c_') === 0) contacts[k.slice(2)] = String(v).trim() === '' ? null : String(v).trim();
        else set[k] = v;
      });
      if (contacts.languages) contacts.languages = contacts.languages.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      set.contacts = contacts;
      ['price_amount', 'dog_fee', 'max_height_m', 'max_length_m', 'max_weight_t', 'visit_min_minutes', 'visit_max_minutes', 'toll_amount'].forEach(function (k) { set[k] = set[k] === '' ? null : Number(set[k]); });
      set.currency = String(set.currency || st.data.currency).toUpperCase();
      // The trip's currency shown by default is not written on the place: it would stay frozen
      // there if the trip's currency changed. Only a currency the user picked is saved.
      if (!st.data.placeCurrency && set.currency === st.data.currency) delete set.currency;
      // The source and its date are shown in the reader's language: sent back only when the user
      // changed them, so the stored language-neutral source (and its auto tag) is kept.
      if (set.source === (st.data.info.source || '')) delete set.source;
      if (String(set.checked || '') === String(st.data.info.checked || '') && !('source' in set)) delete set.checked;
      // A new source with no check date is dated today by the server, as the tool does.
      if (!String(set.checked || '').trim() && set.source && set.source !== (st.data.info.source || '')) delete set.checked;
      // An empty unit or note means "not said".
      set.per = set.per ? set.per : null;
      set.price_note = String(set.price_note || '').trim() || null;
      // Access: an empty time, link, note or currency means "not said"; booking is yes / no / unknown.
      ['access_before', 'access_after', 'booking_url', 'booking_note', 'toll_currency'].forEach(function (k) { set[k] = String(set[k] || '').trim() || null; });
      if (set.toll_currency) set.toll_currency = set.toll_currency.toUpperCase();
      set.booking_required = set.booking_required === 'yes' ? true : set.booking_required === 'no' ? false : null;
      try {
        await trek.invoke('/amenities/save', { method: 'POST', body: body({ tripId: Number(st.tripId), placeId: Number(st.placeId), set: set }) });
        trek.notify('success', S('ui.saved'));
        st.open = false;
        load();
      } catch (e) { trek.notify('error', e.message); }
    }
    // Every place of the trip, 20 at a time, until nothing is left or a source asks to wait.
    async function fillTrip() {
      if (st.filling) return;
      st.filling = true; render();
      var total = 0, r = null, rounds = 0;
      try {
        do {
          r = await trek.invoke('/amenities/fill', { method: 'POST', body: body({ tripId: Number(st.tripId) }) });
          total += r.filled;
        } while (r.remaining > 0 && ++rounds < 40 && !r.osmBusy && !r.park4nightLimited);
        trek.notify('success', S('ui.filledN').replace('{n}', String(total)));
        if (r.osmBusy) trek.notify('info', S('ui.fillOsmBusy'));
        if (r.park4nightLimited) trek.notify('info', S('ui.fillLater'));
      } catch (e) { trek.notify('error', e.message); }
      st.filling = false;
      load();
    }
    async function clearIt() {
      if (!(await trek.confirm({ message: S('ui.confirmClear'), danger: true }))) return;
      try {
        await trek.invoke('/amenities/clear', { method: 'POST', body: body({ tripId: Number(st.tripId), placeId: Number(st.placeId) }) });
        trek.notify('success', S('ui.cleared'));
        st.open = false;
        load();
      } catch (e) { trek.notify('error', e.message); }
    }

    // In TREK's place edit form (mode "edit") the widget opens straight on its editor.
    trek.onContext(function (ctx) {
      var mode = ctx.mode === 'edit' ? 'edit' : 'view';
      var changed = ctx.placeId !== st.placeId || ctx.tripId !== st.tripId || (ctx.locale || 'en') !== st.locale || mode !== st.mode;
      if (ctx.placeId !== st.placeId) { st.dayId = null; st.pending = null; }
      st.tripId = ctx.tripId; st.placeId = ctx.placeId; st.locale = ctx.locale || navigator.language || 'en'; st.mode = mode;
      if (changed) { st.open = mode === 'edit'; load(); }
    });
    // A place edited elsewhere (price in TREK's own form): refetch, debounced.
    var timer = null;
    // Not while the user is typing in the editor or a night's number/reason: a redraw would drop it.
    trek.onEvent(function () { clearTimeout(timer); timer = setTimeout(function () { if (!st.open && !st.pending && !st.busy) load(); }, 800); });
  </script>
</body>
</html>
